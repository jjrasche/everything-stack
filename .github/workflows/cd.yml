name: Build & Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============ Analysis ============
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: echo "# CI/CD analyze - no secrets needed" > .env
      - run: flutter analyze

  # ============ Unit Tests ============
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: echo "# CI/CD unit tests - no secrets needed" > .env

      - name: Run Unit Tests with JUnit Reporter
        run: flutter test test/ --file-reporter json:test-results/unit-tests.json || true

      - name: Convert to JUnit XML
        if: always()
        run: |
          mkdir -p test-results
          # Install junitreport for conversion
          dart pub global activate junitreport
          # Convert Flutter JSON to JUnit XML
          cat test-results/unit-tests.json | dart pub global run junitreport:tojunit > test-results/unit-tests.xml || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 90

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests Report
          path: test-results/unit-tests.xml
          reporter: java-junit
          fail-on-error: false

  # ============ Android Emulator Integration Tests ============
  test-android-emulator:
    name: Android Emulator Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 5X
          script: |
            flutter pub get
            dart run build_runner build --delete-conflicting-outputs
            echo "# CI/CD test - secrets via dart-define" > .env
            mkdir -p test-results

            # Run ALL integration tests using consolidated entry point (solves Flutter bug #135673)
            # flutter test -d <device> doesn't work when both test/ and integration_test/ exist
            # Capture output to file for historical tracking
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/all_tests.dart -d emulator-5554 --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} --dart-define=DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }} --dart-define=JINA_API_KEY=${{ secrets.JINA_API_KEY }} --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} 2>&1 | tee test-results/integration-tests.log

            # Extract pass/fail summary for quick reference
            echo "=== Test Summary ===" >> test-results/integration-summary.txt
            echo "Run: ${{ github.run_number }}" >> test-results/integration-summary.txt
            echo "Commit: ${{ github.sha }}" >> test-results/integration-summary.txt
            echo "Date: $(date -Iseconds)" >> test-results/integration-summary.txt
            grep -E "passed|failed|Some tests" test-results/integration-tests.log >> test-results/integration-summary.txt || true

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 90

  # ============ Build Web ============
  build-web:
    name: Build Web
    needs: [analyze, test-unit]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: echo "# CI/CD web build - no secrets needed" > .env
      - run: flutter build web --release

  # ============ Build Android APK ============
  build-android:
    name: Build Android APK
    needs: [analyze, test-unit, test-android-emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: echo "# CI/CD android build - secrets via dart-define" > .env
      - run: flutter build apk --release --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} --dart-define=DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }} --dart-define=JINA_API_KEY=${{ secrets.JINA_API_KEY }} --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ============ Check Crashes ============
  check-crashes:
    name: Check for Crashes
    needs: [build-android]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -r "throw.*Exception\|crash\|fatal" lib/ --include="*.dart" | grep -v "test\|mock"; then
            echo "::warning::Found potential crash sources"
          fi

