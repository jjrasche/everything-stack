name: Build & Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============ Analysis ============
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: echo "# CI/CD analyze - no secrets needed" > .env
      - run: flutter analyze

  # ============ Unit Tests ============
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: echo "# CI/CD unit tests - no secrets needed" > .env
      - run: flutter test test/

  # ============ Android Emulator Integration Tests ============
  test-android-emulator:
    name: Android Emulator Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 5X
          script: |
            flutter pub get
            dart run build_runner build --delete-conflicting-outputs
            echo "# CI/CD test - secrets via dart-define" > .env

            # Run ALL integration tests using consolidated entry point (solves Flutter bug #135673)
            # flutter test -d <device> doesn't work when both test/ and integration_test/ exist
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/all_tests.dart -d emulator-5554 --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} --dart-define=DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }} --dart-define=JINA_API_KEY=${{ secrets.JINA_API_KEY }} --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

  # ============ Build Web ============
  build-web:
    name: Build Web
    needs: [analyze, test-unit]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: echo "# CI/CD web build - no secrets needed" > .env
      - run: flutter build web --release --web-renderer html

  # ============ Build Android APK ============
  build-android:
    name: Build Android APK
    needs: [analyze, test-unit, test-android-emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: echo "# CI/CD android build - secrets via dart-define" > .env
      - run: flutter build apk --release \
              --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
              --dart-define=DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }} \
              --dart-define=JINA_API_KEY=${{ secrets.JINA_API_KEY }} \
              --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
              --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ============ Check Crashes ============
  check-crashes:
    name: Check for Crashes
    needs: [build-android]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -r "throw.*Exception\|crash\|fatal" lib/ --include="*.dart" | grep -v "test\|mock"; then
            echo "::warning::Found potential crash sources"
          fi

