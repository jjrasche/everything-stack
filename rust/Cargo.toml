[package]
name = "everything_stack_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# FFI bridge to Dart/Flutter
flutter_rust_bridge = "=2.11.1"

# WebSocket implementation (replaces dart:io on native)
# Use rustls-tls-webpki-roots for better cross-platform support (Android, iOS, etc.)
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1.43", features = ["full"] }

# Rustls with aws-lc-rs crypto provider (required for tokio-tungstenite rustls)
# aws-lc-rs is faster and more secure than ring
rustls = { version = "0.23", features = ["aws-lc-rs"] }

# HTTP types for WebSocket headers
http = "1.2"

# URL parsing
url = "2.5"

# Thread-safe collections for connection registry
dashmap = "6.1"
once_cell = "1.20"

# Async runtime
futures = "0.3"

[build-dependencies]
flutter_rust_bridge_codegen = "2.0"
