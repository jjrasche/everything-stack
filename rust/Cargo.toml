[package]
name = "everything_stack_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# FFI bridge to Dart/Flutter
flutter_rust_bridge = "=2.11.1"

# WebSocket implementation (replaces dart:io on native)
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tokio = { version = "1.43", features = ["full"] }

# HTTP types for WebSocket headers
http = "1.2"

# URL parsing
url = "2.5"

# Thread-safe collections for connection registry
dashmap = "6.1"
once_cell = "1.20"

# Async runtime
futures = "0.3"

[build-dependencies]
flutter_rust_bridge_codegen = "2.0"
