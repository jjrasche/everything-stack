<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter Review</title>
<style>
  :root {
    --bg: #0d0d14;
    --surface: #161622;
    --text: #e2e8f0;
    --muted: #555570;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --border: #222238;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex; flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .progress-track {
    flex: 1; height: 4px; background: var(--border); border-radius: 2px;
  }
  .progress-fill {
    height: 100%; border-radius: 2px;
    transition: width 0.2s;
  }
  .progress-fill.borderline { background: var(--yellow); }
  .progress-fill.all { background: var(--green); }
  .counter {
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .filter-btns {
    display: flex; gap: 4px;
  }
  .filter-btn {
    padding: 3px 10px; border-radius: 4px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); font-size: 11px; cursor: pointer;
  }
  .filter-btn.active { color: var(--text); border-color: var(--green); }
  .export-btn {
    padding: 4px 14px; border-radius: 4px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; cursor: pointer;
  }
  .export-btn:hover { color: var(--text); border-color: var(--green); }

  .main {
    flex: 1;
    display: flex; flex-direction: column;
    padding: 24px 48px;
    gap: 16px;
    overflow-y: auto;
  }

  .context {
    font-size: 11px; color: var(--muted);
    text-align: center;
  }
  .confidence-badge {
    display: inline-block;
    padding: 1px 6px; border-radius: 3px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase;
  }
  .confidence-badge.high { background: #1a2e1a; color: var(--green); }
  .confidence-badge.borderline { background: #2e2a1a; color: var(--yellow); }

  .span-text {
    max-width: 760px; width: 100%;
    margin: 0 auto;
    padding: 24px 28px;
    font-size: 16px; line-height: 1.7;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    white-space: pre-wrap;
    user-select: text;
  }

  .label-bar {
    max-width: 760px; width: 100%;
    margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    gap: 24px;
    height: 44px;
  }
  .label-option {
    padding: 6px 24px; border-radius: 6px;
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.12s;
  }
  .label-option.extract { color: var(--green); border-color: var(--border); }
  .label-option.extract.active { border-color: var(--green); background: #1a2e1a; }
  .label-option.skip { color: var(--red); border-color: var(--border); }
  .label-option.skip.active { border-color: var(--red); background: #2e1a1a; }

  .rationale {
    max-width: 760px; width: 100%;
    margin: 0 auto;
    font-size: 13px; color: var(--muted);
    text-align: center;
    font-style: italic;
  }

  .features {
    max-width: 760px; width: 100%;
    margin: 0 auto;
    display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center;
  }
  .feature-chip {
    padding: 2px 8px; border-radius: 3px;
    font-size: 11px; font-family: monospace;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted);
  }

  .override-badge {
    font-size: 10px; color: var(--red);
    font-weight: 700; text-transform: uppercase;
  }

  .bottombar {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: center; gap: 40px;
    flex-shrink: 0;
  }
  .hint {
    font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; height: 26px; padding: 0 6px;
    border-radius: 4px; font-family: monospace; font-size: 13px;
    background: var(--surface); border: 1px solid var(--border);
    color: inherit;
  }

  .done-screen {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: 16px;
  }
  .done-screen h1 { font-size: 28px; }
  .done-stat { font-size: 16px; color: var(--muted); }
  .done-stat strong { color: var(--text); }
  .big-export {
    margin-top: 8px;
    padding: 12px 32px; border-radius: 8px;
    background: var(--green); color: #000;
    border: none; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="counter" id="counter"></span>
  <div class="progress-track"><div class="progress-fill all" id="progressFill"></div></div>
  <div class="filter-btns">
    <button class="filter-btn active" id="btnAll" onclick="setFilter('all')">All</button>
    <button class="filter-btn" id="btnBorderline" onclick="setFilter('borderline')">Borderline</button>
    <button class="filter-btn" id="btnOverridden" onclick="setFilter('overridden')">Overridden</button>
  </div>
  <button class="export-btn" onclick="exportResults()">Export JSON</button>
</div>

<div class="main" id="main"></div>

<div class="bottombar">
  <div class="hint"><kbd>&larr;</kbd> prev</div>
  <div class="hint"><kbd>Tab</kbd> flip</div>
  <div class="hint"><kbd>&rarr;</kbd> next</div>
</div>

<script>
const STORAGE_KEY = 'filter_review_v1';

let allItems = [];
let filteredIndices = [];
let cursor = 0;
let filterMode = 'all';

async function init() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed.version === 1 && Array.isArray(parsed.items) && parsed.items.length > 0) {
        allItems = parsed.items;
        cursor = parsed.cursor || 0;
        filterMode = parsed.filterMode || 'all';
        applyFilter();
        render();
        return;
      }
    } catch(e) {}
  }

  const resp = await fetch('../lib/training/extraction/golden/labels/filter/labeled_200.json');
  const raw = await resp.json();

  allItems = raw.map(item => ({
    ...item,
    claudeLabel: item.label,
    humanLabel: item.label,
    reviewed: false,
  }));

  applyFilter();
  save();
  render();
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    version: 1,
    cursor,
    filterMode,
    items: allItems,
  }));
}

function applyFilter() {
  if (filterMode === 'all') {
    filteredIndices = allItems.map((_, i) => i);
  } else if (filterMode === 'borderline') {
    filteredIndices = allItems
      .map((item, i) => item.confidence === 'borderline' ? i : -1)
      .filter(i => i >= 0);
  } else if (filterMode === 'overridden') {
    filteredIndices = allItems
      .map((item, i) => item.humanLabel !== item.claudeLabel ? i : -1)
      .filter(i => i >= 0);
  }

  document.getElementById('btnAll').className = filterMode === 'all' ? 'filter-btn active' : 'filter-btn';
  document.getElementById('btnBorderline').className = filterMode === 'borderline' ? 'filter-btn active' : 'filter-btn';
  document.getElementById('btnOverridden').className = filterMode === 'overridden' ? 'filter-btn active' : 'filter-btn';

  if (cursor >= filteredIndices.length) cursor = Math.max(0, filteredIndices.length - 1);
}

function setFilter(mode) {
  filterMode = mode;
  cursor = 0;
  applyFilter();
  save();
  render();
}

function flip() {
  if (filteredIndices.length === 0) return;
  const realIdx = filteredIndices[cursor];
  const item = allItems[realIdx];
  item.humanLabel = item.humanLabel === 'extract' ? 'skip' : 'extract';
  item.reviewed = true;
  save();
  render();
}

function navigate(dir) {
  const next = cursor + dir;
  if (next < 0 || next >= filteredIndices.length) return;
  cursor = next;
  save();
  render();
}

function computeFeatures(text) {
  const words = text.split(/\s+/).filter(w => w.length > 0);
  const wordCount = words.length;
  const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
  const sentenceCount = sentences.length;

  const functionWords = new Set(['the','a','an','is','are','was','were','be','been',
    'being','have','has','had','do','does','did','will','would','could','should',
    'may','might','can','shall','to','of','in','for','on','with','at','by','from',
    'as','into','through','during','before','after','above','below','between',
    'but','and','or','nor','not','so','yet','both','either','neither','each',
    'every','all','any','few','more','most','other','some','such','no','only',
    'same','than','too','very','just','also','about','up','out','if','then',
    'that','this','it','its','i','me','my','we','our','you','your','he','she',
    'they','them','their','him','her','what','which','who','how','when','where']);
  const contentWords = words.filter(w => !functionWords.has(w.toLowerCase()));
  const lexicalDensity = wordCount > 0 ? contentWords.length / wordCount : 0;

  const hasNE = /[A-Z][a-z]{2,}/.test(text) || /\b[A-Z]{2,}\b/.test(text);
  const causalMarkers = ['because', 'so that', 'in order to', 'therefore', 'since'];
  const hasCausal = causalMarkers.some(m => text.toLowerCase().includes(m));
  const questionSents = sentences.filter(s => s.trim().endsWith('?') || text.includes('?')).length;
  const questionRatio = sentenceCount > 0 ? questionSents / sentenceCount : 0;

  return { wordCount, sentenceCount, lexicalDensity, hasNamedEntity: hasNE, hasCausalMarker: hasCausal, questionRatio };
}

function render() {
  if (filteredIndices.length === 0) {
    document.getElementById('main').innerHTML = '<div style="text-align:center;color:var(--muted);margin-top:40vh">No items in this filter.</div>';
    document.getElementById('counter').textContent = '0 / 0';
    document.getElementById('progressFill').style.width = '0%';
    return;
  }

  const total = filteredIndices.length;
  document.getElementById('counter').textContent = `${cursor + 1} / ${total}`;
  document.getElementById('progressFill').style.width = `${((cursor + 1) / total) * 100}%`;

  const progressFill = document.getElementById('progressFill');
  progressFill.className = filterMode === 'borderline' ? 'progress-fill borderline' : 'progress-fill all';

  const realIdx = filteredIndices[cursor];
  const item = allItems[realIdx];
  const overridden = item.humanLabel !== item.claudeLabel;
  const features = computeFeatures(item.text);

  const featureChips = [
    `${features.wordCount}w`,
    `${features.sentenceCount} sent`,
    `lex: ${features.lexicalDensity.toFixed(2)}`,
    features.hasNamedEntity ? 'NE' : 'no-NE',
    features.hasCausalMarker ? 'causal' : 'no-causal',
    `q: ${features.questionRatio.toFixed(2)}`,
  ];

  document.getElementById('main').innerHTML = `
    <div class="context">
      ${escapeHtml(item.convName)} &middot; turn ${item.turnIndex} &middot; ${item.speaker} &middot; #${item.index}
      &nbsp;<span class="confidence-badge ${item.confidence}">${item.confidence}</span>
      ${overridden ? '&nbsp;<span class="override-badge">overridden</span>' : ''}
    </div>
    <div class="span-text">${escapeHtml(item.text)}</div>
    <div class="label-bar">
      <div class="label-option extract ${item.humanLabel === 'extract' ? 'active' : ''}" onclick="setLabel('extract')">extract</div>
      <div class="label-option skip ${item.humanLabel === 'skip' ? 'active' : ''}" onclick="setLabel('skip')">skip</div>
    </div>
    <div class="rationale">${escapeHtml(item.rationale)}</div>
    <div class="features">${featureChips.map(c => `<span class="feature-chip">${c}</span>`).join('')}</div>
  `;
}

function setLabel(label) {
  if (filteredIndices.length === 0) return;
  const realIdx = filteredIndices[cursor];
  allItems[realIdx].humanLabel = label;
  allItems[realIdx].reviewed = true;
  save();
  render();
}

function escapeHtml(text) {
  const el = document.createElement('div');
  el.textContent = text;
  return el.innerHTML.replace(/\n/g, '<br>');
}

function computeMetrics() {
  const reviewed = allItems.filter(i => i.reviewed);
  const overridden = allItems.filter(i => i.humanLabel !== i.claudeLabel);
  const extractCount = allItems.filter(i => i.humanLabel === 'extract').length;
  const skipCount = allItems.filter(i => i.humanLabel === 'skip').length;
  return {
    total: allItems.length,
    reviewed: reviewed.length,
    overridden: overridden.length,
    overrideRate: allItems.length > 0 ? overridden.length / allItems.length : 0,
    extractCount,
    skipCount,
    skipRate: allItems.length > 0 ? skipCount / allItems.length : 0,
  };
}

function exportResults() {
  const metrics = computeMetrics();
  const output = {
    exportedAt: new Date().toISOString(),
    version: 1,
    metrics,
    items: allItems.map(item => ({
      index: item.index,
      convUuid: item.convUuid,
      convName: item.convName,
      turnIndex: item.turnIndex,
      speaker: item.speaker,
      spanId: item.spanId,
      wordCount: item.wordCount,
      claudeLabel: item.claudeLabel,
      humanLabel: item.humanLabel,
      confidence: item.confidence,
      rationale: item.rationale,
      reviewed: item.reviewed,
    })),
  };

  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'filter_review_results.json';
  a.click();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowLeft') navigate(-1);
  else if (e.key === 'ArrowRight') navigate(1);
});

init();
</script>
</body>
</html>
