<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohere Review</title>
<style>
  :root {
    --bg: #0d0d14;
    --surface: #161622;
    --text: #e2e8f0;
    --muted: #555570;
    --green: #4ade80;
    --red: #f87171;
    --border: #222238;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex; flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .progress-track {
    flex: 1; height: 4px; background: var(--border); border-radius: 2px;
  }
  .progress-fill {
    height: 100%; background: var(--green); border-radius: 2px;
    transition: width 0.2s;
  }
  .counter {
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .export-btn {
    padding: 4px 14px; border-radius: 4px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; cursor: pointer;
    transition: all 0.15s;
  }
  .export-btn:hover { color: var(--text); border-color: var(--green); }

  /* Main area */
  .main {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 32px 48px;
    gap: 0;
  }

  .sentence {
    max-width: 760px; width: 100%;
    padding: 28px 32px;
    font-size: 17px; line-height: 1.7;
    border-radius: 8px;
  }
  .sentence-a {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    color: #8a8aaa;
  }
  .sentence-b {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
  }

  /* The divider IS the label */
  .divider {
    max-width: 760px; width: 100%;
    display: flex; align-items: center; justify-content: center;
    height: 36px;
    font-size: 12px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .divider.same { color: var(--green); }
  .divider.same::before { content: '── same topic ──'; }
  .divider.boundary { color: var(--red); }
  .divider.boundary::before { content: '── different topic ──'; }
  .divider.unlabeled { color: var(--muted); }
  .divider.unlabeled::before { content: '── ? ──'; }

  /* Bottom */
  .bottombar {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: center; gap: 40px;
    flex-shrink: 0;
  }
  .hint {
    font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .hint.active-same { color: var(--green); }
  .hint.active-boundary { color: var(--red); }
  kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; height: 26px; padding: 0 6px;
    border-radius: 4px; font-family: monospace; font-size: 13px;
    background: var(--surface); border: 1px solid var(--border);
    color: inherit;
  }

  /* Context label */
  .context {
    font-size: 11px; color: var(--muted);
    text-align: center;
    padding: 6px 0 0 0;
  }

  /* Done */
  .done-screen {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    gap: 16px;
  }
  .done-screen h1 { font-size: 28px; }
  .done-stat { font-size: 16px; color: var(--muted); }
  .done-stat strong { color: var(--text); }
  .big-export {
    margin-top: 8px;
    padding: 12px 32px; border-radius: 8px;
    background: var(--green); color: #000;
    border: none; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .big-export:hover { opacity: 0.85; }
</style>
</head>
<body>

<div class="topbar">
  <span class="counter" id="counter"></span>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <button class="export-btn" id="exportBtn" onclick="exportResults()">Export JSON</button>
</div>

<div class="main" id="main"></div>

<div class="bottombar" id="bottombar">
  <div class="hint" id="hintLeft"><kbd>←</kbd> prev</div>
  <div class="hint" id="hintTab"><kbd>Tab</kbd> flip</div>
  <div class="hint" id="hintRight"><kbd>→</kbd> next</div>
</div>

<script>
const STORAGE_KEY = 'cohere_review_v4';
const UNCERTAINTY_THRESHOLD = 0.7;

let state = null;  // { version, cursor, pairs: [...] }

async function init() {
  // Try restore from localStorage first
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      state = JSON.parse(saved);
      if (state.version === 2 && Array.isArray(state.pairs) && state.pairs.length > 0) {
        render();
        return;
      }
    } catch(e) {}
  }

  // Build fresh from review_set.json — only interesting pairs
  const resp = await fetch('../lib/training/extraction/golden/labels/cohere/review_set.json');
  const raw = await resp.json();

  const pairs = [];
  raw.forEach((turn, turnIdx) => {
    const sentMap = {};
    turn.sentences.forEach(s => sentMap[s.id] = s.text);

    turn.modelDecisions.forEach((dec, pairIdx) => {
      // Skip high-confidence same-topic pairs — not worth reviewing
      if (!dec.boundary && dec.score >= UNCERTAINTY_THRESHOLD) return;

      pairs.push({
        turnIdx,
        pairIdx,
        sentAId: dec.pair[0],
        sentBId: dec.pair[1],
        sentA: sentMap[dec.pair[0]] || '',
        sentB: sentMap[dec.pair[1]] || '',
        modelBoundary: dec.boundary,
        modelScore: dec.score,
        humanLabel: dec.boundary ? 'boundary' : 'same',  // pre-populate from model
        convName: turn.convName,
        turnIndex: turn.turnIndex,
        speaker: turn.speaker,
        category: turn.selectionCategory,
      });
    });
  });

  state = { version: 2, cursor: 0, pairs };
  save();
  render();
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function flip() {
  const pair = state.pairs[state.cursor];
  pair.humanLabel = pair.humanLabel === 'same' ? 'boundary' : 'same';
  save();
  render();
}

function navigate(dir) {
  const next = state.cursor + dir;
  if (next < 0 || next >= state.pairs.length) return;
  state.cursor = next;
  save();
  render();
}

function render() {
  const idx = state.cursor;
  const total = state.pairs.length;
  const labeled = state.pairs.filter(p => p.humanLabel !== null).length;

  document.getElementById('counter').textContent = `${idx + 1} / ${total}`;
  document.getElementById('progressFill').style.width = `${((idx + 1) / total) * 100}%`;

  const pair = state.pairs[idx];
  const label = pair.humanLabel;
  const disagreesWithModel = (label === 'boundary') !== pair.modelBoundary;

  document.getElementById('main').innerHTML = `
    <div class="context">${pair.convName} · turn ${pair.turnIndex} · ${pair.speaker} · ${pair.category.replace(/_/g, ' ')}${disagreesWithModel ? ' · <span style="color:var(--red)">overridden</span>' : ''}</div>
    <div style="height: 12px"></div>
    <div class="sentence sentence-a">${escapeHtml(pair.sentA)}</div>
    <div class="divider ${label || 'unlabeled'}"></div>
    <div class="sentence sentence-b">${escapeHtml(pair.sentB)}</div>
  `;

  // Highlight active key hint
  const hintTab = document.getElementById('hintTab');
  hintTab.className = 'hint';
}

function escapeHtml(text) {
  const el = document.createElement('div');
  el.textContent = text;
  return el.innerHTML.replace(/\n/g, '<br>');
}

function computeMetrics() {
  let tp = 0, tn = 0, fp = 0, fn = 0;
  state.pairs.forEach(p => {
    const human = p.humanLabel === 'boundary';
    const model = p.modelBoundary;
    if (model && human) tp++;
    else if (!model && !human) tn++;
    else if (model && !human) fp++;
    else fn++;
  });
  const precision = tp + fp > 0 ? tp / (tp + fp) : 1;
  const recall = tp + fn > 0 ? tp / (tp + fn) : 1;
  const f1 = precision + recall > 0 ? 2 * precision * recall / (precision + recall) : 0;
  return { tp, tn, fp, fn, precision, recall, f1, totalPairs: state.pairs.length };
}

function exportResults() {
  const metrics = computeMetrics();
  const output = {
    exportedAt: new Date().toISOString(),
    version: 1,
    metrics,
    pairs: state.pairs.map(p => ({
      turnIdx: p.turnIdx,
      pairIdx: p.pairIdx,
      sentAId: p.sentAId,
      sentBId: p.sentBId,
      modelBoundary: p.modelBoundary,
      modelScore: p.modelScore,
      humanLabel: p.humanLabel,
      convName: p.convName,
      turnIndex: p.turnIndex,
      speaker: p.speaker,
      category: p.category,
    })),
  };

  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cohere_review_results.json';
  a.click();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowLeft') navigate(-1);
  else if (e.key === 'ArrowRight') navigate(1);
});

init();
</script>
</body>
</html>
