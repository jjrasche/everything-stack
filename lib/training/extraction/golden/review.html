<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Golden Extraction Review</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #fafafa;
  color: #1a1a1a;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* === HEADER === */
#header {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 8px 16px;
  background: #f0f0f0;
  border-bottom: 1px solid #ddd;
  font-size: 14px;
  flex-shrink: 0;
}
#convLabel { font-family: monospace; font-weight: 600; }
#convName { flex: 1; color: #555; }
#turnLabel { font-weight: 600; }
#turnStats { color: #888; font-size: 12px; }
#navHint { color: #999; font-size: 11px; }

/* === MAIN LAYOUT === */
#main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  flex: 1;
  min-height: 0;
  position: relative;
}

#svgWrapper {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
  overflow: hidden;
}

/* === SOURCE PANEL (LEFT) === */
#sourcePanel {
  overflow-y: auto;
  padding: 16px 20px;
  border-right: 1px solid #e0e0e0;
}

.speaker-label {
  font-size: 10px;
  font-weight: 700;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-top: 20px;
  margin-bottom: 6px;
}
.speaker-label:first-child { margin-top: 0; }

.source-text {
  font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-wrap: break-word;
  margin-bottom: 16px;
}

/* === SENTENCE SEGMENTS === */
.sentence {
  display: inline;
  border-radius: 2px;
  padding: 1px 0;
}

.sentence-id {
  font-size: 9px;
  font-weight: 700;
  color: #999;
  vertical-align: super;
  margin-right: 1px;
  user-select: none;
}

/* === HIGHLIGHT CLASSES === */
.hl-extracted {
  background: rgba(72, 187, 120, 0.25);
  border-bottom: 2px solid rgba(72, 187, 120, 0.5);
}
.hl-ephemeral   { background: rgba(160, 160, 160, 0.18); }
.hl-generic     { background: rgba(100, 160, 220, 0.18); }
.hl-already_known { background: rgba(220, 200, 80, 0.22); }
.hl-unresolved  { background: rgba(230, 160, 60, 0.22); }
.hl-trivial     { background: rgba(180, 130, 220, 0.2); }

/* === PROPOSITION PANEL (RIGHT) === */
#propositionPanel {
  overflow-y: auto;
  padding: 16px 20px;
  background: #fdfdfd;
}

.proposition-card {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  padding: 12px 14px;
  margin-bottom: 12px;
  transition: box-shadow 0.15s;
}
.proposition-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

.proposition-index {
  font-size: 10px;
  font-weight: 700;
  color: #aaa;
  margin-bottom: 4px;
}

.proposition-text {
  font-size: 13px;
  line-height: 1.55;
  margin-bottom: 8px;
}

.proposition-sources {
  font-size: 11px;
  color: #777;
  padding: 4px 8px;
  border-left: 3px solid rgba(72, 187, 120, 0.5);
  margin-bottom: 8px;
  line-height: 1.4;
}

.badge-row { display: flex; gap: 6px; flex-wrap: wrap; }

.badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.badge-session    { background: #e0f0ff; color: #2060a0; }
.badge-project    { background: #e8f5e9; color: #2e7d32; }
.badge-life       { background: #fce4ec; color: #c62828; }
.badge-learning   { background: #fff3e0; color: #e65100; }
.badge-exploration { background: #f3e5f5; color: #7b1fa2; }

/* === WORKING MEMORY SECTION === */
.working-memory-section {
  margin-bottom: 16px;
  padding: 10px 12px;
  background: #f8f8f0;
  border: 1px solid #e8e8d8;
  border-radius: 6px;
  font-size: 11px;
  color: #666;
}
.working-memory-section h4 {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #999;
  margin-bottom: 6px;
}
.working-memory-item {
  padding: 2px 0;
  line-height: 1.4;
}

.no-data {
  color: #999;
  font-style: italic;
  text-align: center;
  padding: 60px 20px;
  line-height: 1.6;
}

/* === SVG LINES === */
.connection-line {
  stroke: rgba(72, 187, 120, 0.35);
  stroke-width: 1.5;
  fill: none;
}

/* === FOOTER LEGEND === */
#legend {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 5px 16px;
  font-size: 11px;
  border-top: 1px solid #ddd;
  background: #f5f5f5;
  flex-shrink: 0;
  color: #666;
}
.legend-swatch {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 2px;
  vertical-align: middle;
  margin-right: 4px;
}
.legend-item { white-space: nowrap; }

/* === ERROR STATE === */
#errorBanner {
  display: none;
  background: #fff3cd;
  color: #856404;
  padding: 12px 16px;
  font-size: 13px;
  border-bottom: 1px solid #ffc107;
}
#errorBanner code {
  background: #f8f0d0;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 12px;
}
</style>
</head>
<body>

<div id="errorBanner"></div>

<header id="header">
  <span id="convLabel">--</span>
  <span id="convName">Loading...</span>
  <span id="turnStats"></span>
  <span id="turnLabel">--</span>
  <span id="navHint">&larr;&rarr; conversation &nbsp; &uarr;&darr; turn</span>
</header>

<main id="main">
  <div id="svgWrapper"><svg id="connectionLines"></svg></div>
  <section id="sourcePanel"></section>
  <section id="propositionPanel"></section>
</main>

<footer id="legend">
  <span class="legend-item"><span class="legend-swatch" style="background:rgba(72,187,120,0.35)"></span>extract</span>
  <span class="legend-item"><span class="legend-swatch" style="background:rgba(160,160,160,0.25)"></span>ephemeral</span>
  <span class="legend-item"><span class="legend-swatch" style="background:rgba(100,160,220,0.25)"></span>generic</span>
  <span class="legend-item"><span class="legend-swatch" style="background:rgba(220,200,80,0.3)"></span>already_known</span>
  <span class="legend-item"><span class="legend-swatch" style="background:rgba(230,160,60,0.3)"></span>unresolved</span>
  <span class="legend-item"><span class="legend-swatch" style="background:rgba(180,130,220,0.28)"></span>trivial</span>
</footer>

<script>
// ============================================================
// STATE
// ============================================================
const state = {
  conversations: [],
  currentConvIndex: 0,
  currentTurnIndex: 0,
  turnsData: null,
  extractionData: null,
  selectionData: null,
};

// ============================================================
// DATA LOADING
// ============================================================

function shortId(convUuid) {
  return convUuid.split('-')[0];
}

async function loadIndex() {
  try {
    const response = await fetch('index.json');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    state.conversations = data.conversations || [];
  } catch (err) {
    showError(`Cannot load index.json. ${err.message}. Try: <code>python -m http.server 8080</code> from the golden/ directory.`);
    throw err;
  }
}

async function loadConversation(convUuid) {
  const sid = shortId(convUuid);
  const fetches = [
    fetch(`turns/conv_${sid}.json`).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`extractions/conv_${sid}.json`).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`selection/conv_${sid}.json`).then(r => r.ok ? r.json() : null).catch(() => null),
  ];
  const [turns, extraction, selection] = await Promise.all(fetches);
  state.turnsData = turns;
  state.extractionData = extraction;
  state.selectionData = selection;
}

function extractionForTurn(turnIndex) {
  if (!state.extractionData?.extraction) return null;
  return state.extractionData.extraction.find(e => e.turnIndex === turnIndex) || null;
}

function selectionForTurn(turnIndex) {
  if (!state.selectionData?.selection) return null;
  return state.selectionData.selection.find(s => s.turnIndex === turnIndex) || null;
}

// ============================================================
// SCHEMA DETECTION
// ============================================================

function isPerTurnV2(extraction) {
  return extraction?.schema === 'per-turn-v2';
}

// ============================================================
// HTML ESCAPING
// ============================================================

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ============================================================
// SENTENCE-BASED RENDERING (per-turn-v2)
// ============================================================

function buildSentenceLookup(turnExt) {
  const lookup = {};
  if (!turnExt?.sentences) return lookup;
  for (const s of turnExt.sentences) {
    lookup[s.id] = s;
  }
  return lookup;
}

function buildSpanLookup(turnExt) {
  const lookup = {};
  if (!turnExt?.spans) return lookup;
  for (const span of turnExt.spans) {
    for (const sid of span.sentenceIds) {
      lookup[sid] = span;
    }
  }
  return lookup;
}

function buildPropositionSourceLookup(turnExt) {
  const lookup = {};
  if (!turnExt?.propositions) return lookup;
  turnExt.propositions.forEach((prop, idx) => {
    for (const sid of (prop.sourceIds || [])) {
      if (!lookup[sid]) lookup[sid] = [];
      lookup[sid].push(idx);
    }
  });
  return lookup;
}

function cssClassForSpan(span) {
  if (span.label === 'extract') return 'hl-extracted';
  const reason = span.reason || 'ephemeral';
  return `hl-${reason}`;
}

function renderSentenceBasedSource(turnExt) {
  const sentences = turnExt.sentences || [];
  const spanLookup = buildSpanLookup(turnExt);
  const propSourceLookup = buildPropositionSourceLookup(turnExt);

  const userSentences = sentences.filter(s => s.speaker === 'user');
  const assistantSentences = sentences.filter(s => s.speaker === 'assistant');

  let html = '';

  if (userSentences.length > 0) {
    html += '<div class="speaker-label">User</div><div class="source-text">';
    html += renderSentenceGroup(userSentences, spanLookup, propSourceLookup);
    html += '</div>';
  }

  if (assistantSentences.length > 0) {
    html += '<div class="speaker-label">Assistant</div><div class="source-text">';
    html += renderSentenceGroup(assistantSentences, spanLookup, propSourceLookup);
    html += '</div>';
  }

  return html;
}

function renderSentenceGroup(sentences, spanLookup, propSourceLookup) {
  let html = '';
  for (const sentence of sentences) {
    const span = spanLookup[sentence.id];
    const cssClass = span ? cssClassForSpan(span) : '';
    const propIndices = propSourceLookup[sentence.id] || [];

    // Build data attributes for connection lines
    const dataAttrs = propIndices.map(i => `data-prop-index="${i}"`).join(' ');
    const sentenceIdAttr = `data-sentence-id="${sentence.id}"`;

    html += `<span class="sentence ${cssClass}" ${sentenceIdAttr} ${dataAttrs}>`;
    html += `<span class="sentence-id">${escapeHtml(sentence.id)}</span>`;
    html += escapeHtml(sentence.text);
    html += '</span> ';
  }
  return html;
}

// ============================================================
// LEGACY EVIDENCE-SPAN RENDERING (pre-v2 schemas)
// ============================================================

function buildLegacySpanList(turnIndex) {
  const spans = [];
  const ext = extractionForTurn(turnIndex);
  const sel = selectionForTurn(turnIndex);

  if (ext) {
    (ext.extracted || []).forEach((item, idx) => {
      if (item.evidenceSpan) {
        spans.push({ text: item.evidenceSpan, cssClass: 'hl-extracted', insightIndex: idx });
      }
    });
    (ext.skipped || []).forEach(item => {
      if (item.evidenceSpan) {
        const reason = item.reason || 'ephemeral';
        spans.push({ text: item.evidenceSpan, cssClass: `hl-${reason}`, insightIndex: null });
      }
    });
  } else if (sel) {
    (sel.selected || []).forEach((item, idx) => {
      if (item.evidenceSpan) {
        spans.push({ text: item.evidenceSpan, cssClass: 'hl-extracted', insightIndex: idx });
      }
    });
    (sel.skipped || []).forEach(item => {
      if (item.evidenceSpan) {
        const reason = item.reason || 'ephemeral';
        spans.push({ text: item.evidenceSpan, cssClass: `hl-${reason}`, insightIndex: null });
      }
    });
  }

  return spans;
}

function findUnclaimedMatch(text, searchText, claimed) {
  let searchFrom = 0;
  while (true) {
    const pos = text.indexOf(searchText, searchFrom);
    if (pos === -1) break;
    const end = pos + searchText.length;
    if (!claimed.some(c => pos < c.end && end > c.start)) return pos;
    searchFrom = pos + 1;
  }

  const lowerText = text.toLowerCase();
  const lowerSearch = searchText.toLowerCase();
  searchFrom = 0;
  while (true) {
    const pos = lowerText.indexOf(lowerSearch, searchFrom);
    if (pos === -1) break;
    const end = pos + searchText.length;
    if (!claimed.some(c => pos < c.end && end > c.start)) return pos;
    searchFrom = pos + 1;
  }

  return -1;
}

function locateSpans(text, spans) {
  const located = [];
  const claimed = [];
  const sorted = spans.slice().sort((a, b) => b.text.length - a.text.length);

  for (const span of sorted) {
    const pos = findUnclaimedMatch(text, span.text, claimed);
    if (pos === -1) {
      console.warn(`Span not found: "${span.text.substring(0, 60)}..."`);
      continue;
    }
    const entry = { start: pos, end: pos + span.text.length, cssClass: span.cssClass, insightIndex: span.insightIndex };
    located.push(entry);
    claimed.push(entry);
  }

  located.sort((a, b) => a.start - b.start || b.end - a.end);
  return located;
}

function buildHighlightedHtml(text, locatedSpans) {
  if (locatedSpans.length === 0) return escapeHtml(text);

  const parts = [];
  let cursor = 0;

  for (const span of locatedSpans) {
    if (span.start > cursor) {
      parts.push(escapeHtml(text.substring(cursor, span.start)));
    }
    const idAttr = span.insightIndex !== null ? ` data-insight-index="${span.insightIndex}"` : '';
    const spanId = `span-${span.start}-${span.end}`;
    parts.push(`<span class="${span.cssClass}" data-span-id="${spanId}"${idAttr}>`);
    parts.push(escapeHtml(text.substring(span.start, span.end)));
    parts.push('</span>');
    cursor = span.end;
  }

  if (cursor < text.length) {
    parts.push(escapeHtml(text.substring(cursor)));
  }

  return parts.join('');
}

function renderLegacySourceText(turn, turnIndex) {
  const spans = buildLegacySpanList(turnIndex);
  const promptText = turn.prompt || '';
  const responseText = turn.response || '';

  let html = '';

  if (promptText) {
    const promptSpans = spans.filter(s => findUnclaimedMatch(promptText, s.text, []) !== -1);
    const located = locateSpans(promptText, promptSpans);
    html += `<div class="speaker-label">User</div><div class="source-text">${buildHighlightedHtml(promptText, located)}</div>`;
  }

  if (responseText) {
    const responseSpans = spans.filter(s => findUnclaimedMatch(responseText, s.text, []) !== -1);
    const located = locateSpans(responseText, responseSpans);
    html += `<div class="speaker-label">Assistant</div><div class="source-text">${buildHighlightedHtml(responseText, located)}</div>`;
  }

  return html;
}

// ============================================================
// RENDERING
// ============================================================

function renderHeader() {
  const conv = state.conversations[state.currentConvIndex];
  if (!conv) return;
  const sid = shortId(conv.convUuid);
  document.getElementById('convLabel').textContent = `conv_${sid}`;
  document.getElementById('convName').textContent = conv.convName || '';
  const turnCount = state.turnsData?.turnCount || conv.turnCount || '?';
  document.getElementById('turnLabel').textContent = `Turn ${state.currentTurnIndex} / ${turnCount - 1}`;

  const turnExt = extractionForTurn(state.currentTurnIndex);
  if (turnExt && isPerTurnV2(state.extractionData)) {
    const sentenceCount = turnExt.sentences?.length || 0;
    const extractCount = (turnExt.spans || []).filter(s => s.label === 'extract').length;
    const skipCount = (turnExt.spans || []).filter(s => s.label === 'skip').length;
    const propCount = turnExt.propositions?.length || 0;
    document.getElementById('turnStats').textContent =
      `${sentenceCount} sentences | ${extractCount} extract, ${skipCount} skip | ${propCount} propositions`;
  } else if (turnExt) {
    const extractedCount = turnExt.extracted?.length || 0;
    const skippedCount = turnExt.skipped?.length || 0;
    document.getElementById('turnStats').textContent =
      `${extractedCount} extracted, ${skippedCount} skipped`;
  } else {
    document.getElementById('turnStats').textContent = '';
  }
}

function renderSourceText() {
  const panel = document.getElementById('sourcePanel');

  if (!state.turnsData?.turns) {
    panel.innerHTML = '<div class="no-data">No turn data available</div>';
    return;
  }

  const turn = state.turnsData.turns[state.currentTurnIndex];
  if (!turn) {
    panel.innerHTML = '<div class="no-data">Turn not found</div>';
    return;
  }

  const turnExt = extractionForTurn(state.currentTurnIndex);

  // per-turn-v2: sentence-based rendering (no fuzzy matching needed)
  if (turnExt && isPerTurnV2(state.extractionData) && turnExt.sentences) {
    panel.innerHTML = renderSentenceBasedSource(turnExt);
    return;
  }

  // Legacy: evidence-span fuzzy matching
  panel.innerHTML = renderLegacySourceText(turn, state.currentTurnIndex);
}

function renderPropositionCards() {
  const panel = document.getElementById('propositionPanel');
  const turnExt = extractionForTurn(state.currentTurnIndex);
  const sel = selectionForTurn(state.currentTurnIndex);

  if (!turnExt && !sel) {
    panel.innerHTML = '<div class="no-data">No extraction data for this turn</div>';
    return;
  }

  let html = '';

  // per-turn-v2 schema
  if (turnExt && isPerTurnV2(state.extractionData)) {
    // Working memory before
    const workingMemory = turnExt.workingMemoryBefore || turnExt.whiteboardBefore || [];
    if (workingMemory.length > 0) {
      html += '<div class="working-memory-section"><h4>Working memory before</h4>';
      workingMemory.forEach(item => {
        const text = typeof item === 'string' ? item : item.text || JSON.stringify(item);
        html += `<div class="working-memory-item">- ${escapeHtml(text)}</div>`;
      });
      html += '</div>';
    }

    const propositions = turnExt.propositions || [];
    if (propositions.length === 0) {
      html += '<div class="no-data">No propositions extracted from this turn</div>';
    } else {
      propositions.forEach((prop, idx) => {
        const scopeClass = `badge-${prop.scope || 'project'}`;
        const typeClass = `badge-${prop.type || 'learning'}`;
        const sourceLabel = (prop.sourceIds || []).join(', ');

        html += `
          <div class="proposition-card" data-card-index="${idx}">
            <div class="proposition-index">#${idx}</div>
            <div class="proposition-text">${escapeHtml(prop.text || '')}</div>
            <div class="proposition-sources">Source: ${escapeHtml(sourceLabel)}</div>
            <div class="badge-row">
              <span class="badge ${scopeClass}">${escapeHtml(prop.scope || '')}</span>
              <span class="badge ${typeClass}">${escapeHtml(prop.type || '')}</span>
            </div>
          </div>`;
      });
    }

    panel.innerHTML = html;
    return;
  }

  // Legacy schema
  const insights = turnExt?.extracted || [];
  if (insights.length === 0) {
    const candidates = sel?.selected || [];
    if (candidates.length === 0) {
      panel.innerHTML = '<div class="no-data">No insights extracted from this turn</div>';
      return;
    }
    html += '<div style="color:#999;font-size:11px;margin-bottom:12px;">Stage 1 candidates (no Stage 2 formatting yet)</div>';
    candidates.forEach((c, idx) => {
      html += `
        <div class="proposition-card" data-card-index="${idx}">
          <div class="proposition-index">#${idx}</div>
          <div class="proposition-text">${escapeHtml(c.candidateDescription || '')}</div>
          <div class="proposition-sources">${escapeHtml(c.evidenceSpan || '')}</div>
        </div>`;
    });
    panel.innerHTML = html;
    return;
  }

  insights.forEach((insight, idx) => {
    const scopeClass = `badge-${insight.scope || 'project'}`;
    const typeClass = `badge-${insight.type || 'learning'}`;

    html += `
      <div class="proposition-card" data-card-index="${idx}">
        <div class="proposition-index">#${idx}</div>
        <div class="proposition-text">${escapeHtml(insight.content || '')}</div>
        <div class="proposition-sources">${escapeHtml(insight.evidenceSpan || '')}</div>
        <div class="badge-row">
          <span class="badge ${scopeClass}">${escapeHtml(insight.scope || '')}</span>
          <span class="badge ${typeClass}">${escapeHtml(insight.type || '')}</span>
        </div>
      </div>`;
  });

  panel.innerHTML = html;
}

function renderConnectionLines() {
  const svg = document.getElementById('connectionLines');
  svg.innerHTML = '';

  const mainEl = document.getElementById('main');
  const mainRect = mainEl.getBoundingClientRect();

  svg.setAttribute('width', mainRect.width);
  svg.setAttribute('height', mainRect.height);
  svg.setAttribute('viewBox', `0 0 ${mainRect.width} ${mainRect.height}`);

  const sourcePanel = document.getElementById('sourcePanel');
  const propPanel = document.getElementById('propositionPanel');
  const sourcePanelRect = sourcePanel.getBoundingClientRect();
  const propPanelRect = propPanel.getBoundingClientRect();

  const turnExt = extractionForTurn(state.currentTurnIndex);

  if (turnExt && isPerTurnV2(state.extractionData)) {
    // per-turn-v2: connect sentences to proposition cards via data-prop-index
    const sentenceEls = sourcePanel.querySelectorAll('[data-prop-index]');
    sentenceEls.forEach(sentenceEl => {
      const propIdx = parseInt(sentenceEl.getAttribute('data-prop-index'), 10);
      const cardEl = propPanel.querySelector(`[data-card-index="${propIdx}"]`);
      if (!cardEl) return;

      drawConnectionLine(sentenceEl, cardEl, mainRect, sourcePanelRect, propPanelRect, svg);
    });
  } else {
    // Legacy: connect via data-insight-index
    const highlightedSpans = sourcePanel.querySelectorAll('[data-insight-index]');
    highlightedSpans.forEach(spanEl => {
      const insightIdx = parseInt(spanEl.getAttribute('data-insight-index'), 10);
      const cardEl = propPanel.querySelector(`[data-card-index="${insightIdx}"]`);
      if (!cardEl) return;

      drawConnectionLine(spanEl, cardEl, mainRect, sourcePanelRect, propPanelRect, svg);
    });
  }
}

function drawConnectionLine(sourceEl, targetEl, mainRect, sourcePanelRect, targetPanelRect, svg) {
  const sourceRect = sourceEl.getBoundingClientRect();
  const targetRect = targetEl.getBoundingClientRect();

  const sourceVisible = sourceRect.bottom > sourcePanelRect.top && sourceRect.top < sourcePanelRect.bottom;
  const targetVisible = targetRect.bottom > targetPanelRect.top && targetRect.top < targetPanelRect.bottom;

  if (!sourceVisible && !targetVisible) return;

  const x1 = sourceRect.right - mainRect.left;
  const y1 = (sourceRect.top + sourceRect.bottom) / 2 - mainRect.top;
  const x2 = targetRect.left - mainRect.left;
  const y2 = (targetRect.top + targetRect.bottom) / 2 - mainRect.top;

  const midX = (x1 + x2) / 2;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
  path.setAttribute('class', 'connection-line');
  svg.appendChild(path);
}

function renderTurn() {
  renderHeader();
  renderSourceText();
  renderPropositionCards();
  requestAnimationFrame(() => {
    renderConnectionLines();
  });
}

// ============================================================
// NAVIGATION
// ============================================================

function updateUrl() {
  const conv = state.conversations[state.currentConvIndex];
  if (!conv) return;
  const sid = shortId(conv.convUuid);
  const params = new URLSearchParams({ conv: sid, turn: state.currentTurnIndex });
  history.replaceState(null, '', `?${params}`);
}

async function navigateToTurn(turnIndex) {
  const maxTurn = (state.turnsData?.turnCount || 1) - 1;
  const clamped = Math.max(0, Math.min(turnIndex, maxTurn));
  if (clamped === state.currentTurnIndex) return;
  state.currentTurnIndex = clamped;
  renderTurn();
  updateUrl();
}

async function navigateToConversation(convIndex) {
  const clamped = Math.max(0, Math.min(convIndex, state.conversations.length - 1));
  if (clamped === state.currentConvIndex && state.turnsData) return;
  state.currentConvIndex = clamped;
  state.currentTurnIndex = 0;
  const conv = state.conversations[clamped];
  await loadConversation(conv.convUuid);
  renderTurn();
  updateUrl();
}

function loadFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const convParam = params.get('conv');
  const turnParam = params.get('turn');

  if (convParam) {
    const idx = state.conversations.findIndex(c => shortId(c.convUuid) === convParam);
    if (idx !== -1) {
      state.currentConvIndex = idx;
    }
  }

  if (turnParam) {
    state.currentTurnIndex = parseInt(turnParam, 10) || 0;
  }
}

// ============================================================
// SCROLL-AWARE LINE REDRAWING
// ============================================================

let lineRedrawScheduled = false;

function scheduleLineRedraw() {
  if (lineRedrawScheduled) return;
  lineRedrawScheduled = true;
  requestAnimationFrame(() => {
    renderConnectionLines();
    lineRedrawScheduled = false;
  });
}

// ============================================================
// EVENT HANDLING
// ============================================================

document.addEventListener('keydown', (event) => {
  switch (event.key) {
    case 'ArrowUp':
      event.preventDefault();
      navigateToTurn(state.currentTurnIndex - 1);
      break;
    case 'ArrowDown':
      event.preventDefault();
      navigateToTurn(state.currentTurnIndex + 1);
      break;
    case 'ArrowLeft':
      event.preventDefault();
      navigateToConversation(state.currentConvIndex - 1);
      break;
    case 'ArrowRight':
      event.preventDefault();
      navigateToConversation(state.currentConvIndex + 1);
      break;
  }
});

// ============================================================
// ERROR DISPLAY
// ============================================================

function showError(message) {
  const banner = document.getElementById('errorBanner');
  banner.innerHTML = message;
  banner.style.display = 'block';
}

// ============================================================
// INITIALIZATION
// ============================================================

async function initialize() {
  try {
    await loadIndex();
  } catch {
    return;
  }

  if (state.conversations.length === 0) {
    showError('No conversations found in index.json');
    return;
  }

  loadFromUrl();

  const conv = state.conversations[state.currentConvIndex];
  await loadConversation(conv.convUuid);
  renderTurn();
  updateUrl();

  document.getElementById('sourcePanel').addEventListener('scroll', scheduleLineRedraw);
  document.getElementById('propositionPanel').addEventListener('scroll', scheduleLineRedraw);
}

document.addEventListener('DOMContentLoaded', initialize);
</script>
</body>
