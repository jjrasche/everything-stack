name: everything_stack_template
description: Everything Stack template - clone and customize for your project.
version: 0.2.1

# Update these when initializing your project:
# name: your_project_name
# description: Your project description

environment:
  sdk: '>=3.3.0 <4.0.0'  # Requires 3.3+ for extension type syntax
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # Local database (offline-first)
  # ObjectBox - native platforms (Android, iOS, desktop)
  objectbox: ^4.0.3
  objectbox_flutter_libs: ^4.0.3
  
  # Cloud database (sync)
  supabase_flutter: ^2.3.0

  # Crash reporting

  # State management
  flutter_riverpod: ^2.4.0

  # Dependency injection
  get_it: ^7.0.0

  # Utilities
  uuid: ^4.2.0
  path_provider: ^2.1.0
  connectivity_plus: ^5.0.0
  geolocator: ^10.1.0
  rfc_6902: ^0.3.1
  json_annotation: ^4.8.0
  http: ^1.1.0
  flutter_dotenv: ^5.1.0
  timeago: ^3.7.0

  # WebSocket support (for Deepgram STT)
  web_socket_channel: ^3.0.0
  universal_io: ^2.2.2  # Pure Dart WebSocket (fixes Flutter Windows wss:// bug)

  # File input and storage
  image_picker: ^1.1.0
  record: ^6.1.2
  file_picker: ^8.0.0
  image: ^4.1.0

  # Text-to-speech synthesis (STT is via Deepgram API, not local plugin)
  flutter_tts: ^4.2.3

  # HNSW vector search (for web platform)
  local_hnsw: ^1.0.0
  audioplayers: ^6.5.1
  flutter_rust_bridge: 2.11.1
  # sentry_flutter: ^9.10.0  # DISABLED: Pulls in JNI (Java) on Windows, blocking builds. Re-enable for production.

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation for JSON serialization
  json_serializable: ^6.8.0
  build_runner: ^2.4.13
  analyzer: ^6.0.0  # Updated to support extension type syntax

  # ObjectBox code generation
  objectbox_generator: ^4.0.3

  # Linting
  flutter_lints: ^3.0.0

  # Testing
  mockito: ^5.4.0
  pubspec_checker: ^1.3.0

  # Native assets build (for Rust FFI)
  native_assets_cli: ^0.9.0
  native_toolchain_rust: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - .env
